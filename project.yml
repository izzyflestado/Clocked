name: Clocked

options:
  bundleIdPrefix: com.izzy
  deploymentTarget:
    macOS: "14.0"

targets:
  Clocked:
    type: application
    platform: macOS
    sources:
      - path: Sources/Clocked
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izzy.clocked
        PRODUCT_NAME: Clocked
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
